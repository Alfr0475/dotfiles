# シンボリックリンクの配置定義
#
#   <src/ 以下の相対パス>    <配置先>
#
# - 空行と `#` 始まりの行は無視される
# - 配置先の `~` と `$HOME` は展開される
# - ディレクトリを指定するとディレクトリ自体がリンクされる
# - 区切りは空白（スペース/タブ）。パスに空白を含む場合は非対応
#
# 配置先を変えたい場合はこのファイルの右側だけ書き換えて `make deploy` すればよい。
# 例: zsh を XDG に寄せたい場合は src/.zshenv で ZDOTDIR を設定した上で
#     .zshrc  ~/.config/zsh/.zshrc
# とする。ただし .zshenv は必ず ~/.zshenv に置く必要がある（zsh が最初に読む
# 時点で ZDOTDIR が未設定のため $HOME にフォールバックする）。

# ---- zsh ----
.zshenv                 ~/.zshenv
.zshrc                  ~/.zshrc
zsh/rc.d                ~/.config/zsh/rc.d

# ---- tmux ----
.tmux.conf              ~/.tmux.conf

# ---- mise ----
mise/config.toml        ~/.config/mise/config.toml
