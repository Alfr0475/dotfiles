#------------------------------------------------------------------------------
# .tmux.conf  ->  ~/.tmux.conf
#
# キーバインドは Emacs 風。
#
#   反映: tmux source-file ~/.tmux.conf   (または prefix + r)
#   確認: tmux show-options -g / tmux list-keys
#------------------------------------------------------------------------------

#------------------------------------------------------------------------------
# prefix
#------------------------------------------------------------------------------
set -g prefix C-z
set -g prefix2 C-o

# 余計なキーバインドを削除
unbind C-b
unbind C-o

# C-z*2 で tmux 内のプログラムに C-z を送る
bind C-z send-prefix

#------------------------------------------------------------------------------
# 基本
#------------------------------------------------------------------------------
# Emacs 風のキーバインド
setw -g mode-keys emacs

# 全ての beep を無視
set-option -g bell-action none

# キーストロークのディレイを減らす
set -sg escape-time 0

# ウィンドウのインデックスを1から始める
set -g base-index 1

# ペインのインデックスを1から始める
setw -g pane-base-index 1

# 256色端末を使用する
set -g default-terminal "screen-256color"

# tmux 上でのコピペ問題対策。
# 最近の macOS では tmux から直接 pbcopy が使えるため
# reattach-to-user-namespace は指定しない。
# 必要になったら次にする:
#   set-option -g default-command "reattach-to-user-namespace -l $SHELL"
set-option -g default-command ""

#------------------------------------------------------------------------------
# キーバインド（Emacs 風）
#------------------------------------------------------------------------------
# 画面分割
bind 0 kill-pane
bind 1 break-pane
bind 2 split-window -v
bind 3 split-window -h

# ペインローテート
bind C-o select-pane -t :.+

# ウィンドウ / ペイン削除
bind C-k kill-pane
bind k kill-window

# Ctrl を離すのがめんどくさい
bind C-n next-window
bind C-p previous-window
bind C-c new-window

# コピーモード
bind -r ^[ copy-mode

# シンクロの開始・終了をトグルで行う
bind S set-window-option synchronize-panes

# 設定の再読み込み
# 小文字の r は tmux 既定の refresh-client なので潰さず R を使う
bind R source-file ~/.tmux.conf \; display "reloaded ~/.tmux.conf"

#------------------------------------------------------------------------------
# マウス
#------------------------------------------------------------------------------
# tmux 2.1 からマウスの設定方法が変わった
set-option -g mouse on

# マウススクロール
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

#------------------------------------------------------------------------------
# ステータスライン（tmux-powerline）
#
# 本体は ~/.tmux/plugins/tmux-powerline（make tmux-plugins で導入。リポジトリ外）
# 設定は ~/.config/tmux-powerline/config.sh
# カスタムテーマは ~/.config/tmux-powerline/themes/note.sh
#
# powerline が未導入でもステータスラインが空にならないよう、
# 存在するときだけ差し替える。
#------------------------------------------------------------------------------
# 基本のテーマ
set-environment -g TMUX_POWERLINE_THEME "note"

set -g status on
set -g status-bg colour235
set-option -g status-interval 2
set-option -g status-justify "left"
set-option -g status-left-length 100
set-option -g status-right-length 130

if-shell "[ -x ~/.tmux/plugins/tmux-powerline/powerline.sh ]" \
  'set-option -g status-left  "#(~/.tmux/plugins/tmux-powerline/powerline.sh left)" ; \
   set-option -g status-right "#(~/.tmux/plugins/tmux-powerline/powerline.sh right)"' \
  'set -g status-style "bg=colour234,fg=colour250" ; \
   set-option -g status-left  "#[bg=colour24,fg=colour255,bold] #S #[default] " ; \
   set-option -g status-right "#[fg=colour244]#(whoami)@#h #[fg=colour250]%m/%d %H:%M "'

# ウィンドウリストを左寄せにする
set-window-option -g window-status-current-format "#[fg=colour235, bg=colour27]#[fg=colour255, bg=colour27] #I  #W #[fg=colour27, bg=colour235]"

#------------------------------------------------------------------------------
# 見た目
#------------------------------------------------------------------------------
# pane ボーダーの色設定
set -g pane-border-style fg="blue"
set -g pane-active-border-style fg="red"

#------------------------------------------------------------------------------
# このマシン固有の設定（リポジトリ管理外）
#------------------------------------------------------------------------------
if-shell "[ -f ~/.tmux.conf.local ]" "source-file ~/.tmux.conf.local"
