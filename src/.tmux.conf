#------------------------------------------------------------------------------
# .tmux.conf  ->  ~/.tmux.conf
#
# 旧 .tmux.d / tmux-powerline の設定はここへ移す。
#   反映: tmux source-file ~/.tmux.conf   (または prefix + r)
#   確認: tmux show-options -g / tmux list-keys
#------------------------------------------------------------------------------

#------------------------------------------------------------------------------
# 基本
#------------------------------------------------------------------------------
set -g prefix C-t                  # prefix を C-t に
unbind C-b
bind C-t send-prefix               # prefix を 2 回押すとアプリ側へ送る

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # true color
set -s escape-time 10              # ESC の待ち時間を詰める（vim 用）
set -g focus-events on
set -g history-limit 50000
set -g display-time 2000
set -g mouse on

set -g base-index 1                # ウィンドウ番号を 1 始まりに
setw -g pane-base-index 1
set -g renumber-windows on         # ウィンドウを閉じたら番号を詰める

#------------------------------------------------------------------------------
# キーバインド
#------------------------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display "reloaded ~/.tmux.conf"

# 分割（現在のディレクトリを引き継ぐ）
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ペイン移動（vim 風）
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ペインサイズ変更（連打可）
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

#------------------------------------------------------------------------------
# コピーモード
#
# 最近の macOS では tmux から pbcopy が直接使えるため
# reattach-to-user-namespace は基本的に不要。
# 効かない場合は default-command を以下にする:
#   set -g default-command "reattach-to-user-namespace -l $SHELL"
#------------------------------------------------------------------------------
setw -g mode-keys vi
bind [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"
bind ] paste-buffer

#------------------------------------------------------------------------------
# 見た目
#------------------------------------------------------------------------------
set -g status-position bottom
set -g status-interval 5
set -g status-justify left

set -g status-style "bg=colour234,fg=colour250"
set -g status-left  "#[bg=colour24,fg=colour255,bold] #S #[default] "
set -g status-right "#[fg=colour244]#(whoami)@#h #[fg=colour250]%m/%d %H:%M "
set -g status-left-length 40
set -g status-right-length 60

setw -g window-status-format         " #I:#W#F "
setw -g window-status-current-format "#[bg=colour238,fg=colour255,bold] #I:#W#F #[default]"

set -g pane-border-style        "fg=colour238"
set -g pane-active-border-style "fg=colour24"
set -g message-style            "bg=colour24,fg=colour255"

#------------------------------------------------------------------------------
# このマシン固有の設定（リポジトリ管理外）
#------------------------------------------------------------------------------
if-shell "[ -f ~/.tmux.conf.local ]" "source-file ~/.tmux.conf.local"
